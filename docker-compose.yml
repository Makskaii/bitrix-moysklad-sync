services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sync
      POSTGRES_USER: sync
      POSTGRES_PASSWORD: local-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sync -d sync"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://sync:local-only@db:5432/sync?schema=public
      PORT: 3000
      SYNC_MODE: ${SYNC_MODE:-apply}
      SYNC_STATE: ${SYNC_STATE:-off}
      DRY_DATABASE_URL: ${DRY_DATABASE_URL:-}
      BITRIX24_REST_BASE_URL: ${BITRIX24_REST_BASE_URL:-}
      BITRIX24_ALLOWED_ORIGIN: ${BITRIX24_ALLOWED_ORIGIN:-}
      BITRIX24_EVENT_APPLICATION_TOKEN: ${BITRIX24_EVENT_APPLICATION_TOKEN:-}
      MOYSKLAD_WEBHOOK_SECRET: ${MOYSKLAD_WEBHOOK_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 3s
      retries: 10

  smoke:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["node", "dist/apps/api/smoke.js"]
    environment:
      API_URL: http://api:3000
    depends_on:
      api:
        condition: service_healthy
    profiles: ["test"]

  browser-smoke:
    build:
      context: .
      dockerfile: apps/web/e2e.Dockerfile
    environment:
      BASE_URL: http://web
    depends_on:
      web:
        condition: service_healthy
    profiles: ["test"]

  events-api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://sync:local-only@db:5432/sync?schema=events_test
      PORT: 3000
      SYNC_MODE: apply
      SYNC_STATE: on
      BITRIX24_EVENT_APPLICATION_TOKEN: ${BITRIX24_EVENT_APPLICATION_TOKEN:-}
      MOYSKLAD_WEBHOOK_SECRET: ${MOYSKLAD_WEBHOOK_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 20
    profiles: ["events-test"]

  events-smoke:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["node", "dist/apps/api/src/events-postgres-smoke.js"]
    environment:
      API_URL: http://events-api:3000
      DATABASE_URL: postgresql://sync:local-only@db:5432/sync?schema=events_test
      BITRIX24_EVENT_APPLICATION_TOKEN: ${BITRIX24_EVENT_APPLICATION_TOKEN:-}
      MOYSKLAD_WEBHOOK_SECRET: ${MOYSKLAD_WEBHOOK_SECRET:-}
    depends_on:
      events-api:
        condition: service_healthy
    profiles: ["events-test"]

volumes:
  postgres-data:
